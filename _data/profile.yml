short_bio: >-
  <p>
    I am a Master's student at the School of Computer Science and Technology,
    East China Normal University (ECNU), and a member of the
    Visual Perception + X (VPX) Group. My current work focuses on video analysis,
    computer vision, and multimodal learning.
  </p>
  <p>
    My research interests include video content understanding, temporal modeling,
    multimodal large models, and robust visual recognition under domain shifts.
    I am also interested in applying visual perception to practical scenarios
    such as psychological sandplay analysis, industrial inspection, and medical
    image analysis.
  </p>
  <p>
    Before joining ECNU, I received my B.S. in Computer Science and Technology
    from Huazhong Agricultural University. I have experience in algorithmic
    programming competitions and full-stack AI system development.
  </p>

