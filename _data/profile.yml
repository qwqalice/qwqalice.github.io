    Worked on football-oriented AI systems for video understanding, player
    tracking, and multimodal data pipelines.
  details:
  - >-
    Designed and documented a streaming soccer video understanding pipeline,
    including event-boundary modeling, short-term event memory, memory-to-caption
    stages, and causal evidence-grounded commentary data requirements.
  - >-
    Built football player tracking and ReID data workflows that convert match
    videos into tracklets, player crops, pair manifests, OCR-assisted jersey
    number signals, and weakly supervised identity-training data.
  - >-
    Explored long-term player identity baselines with frozen visual embeddings,
    tracklet-level graph association, team constraints, jersey cues, and
    cross-camera / re-entry analysis.
  - >-
    Organized football player image assets and match-preview metadata pipelines,
    covering roster normalization, face/body/jersey screening rules, sourced
    evidence collection, and structured preview generation.

