short_bio: >-
  <p>
    I am a Master's student at the School of Computer Science and Technology,
    East China Normal University (ECNU), supervised by Prof. Changbo Wang and
    Assoc. Prof. Yang Li. My research interests include video content
    understanding, multimodal large models, vision foundation models, and
    computer vision. Currently, my work focuses on streaming video understanding,
    memory management mechanisms in vision-language models, and multi-task
    training for vision-language models.
  </p>
  <p>
    Before joining ECNU, I received my B.S. in Computer Science and Technology
    from Huazhong Agricultural University. During my undergraduate years, I was
    an active competitive programmer and won awards in multiple national
    programming contests. In addition, I have full-stack AI system development
    experience spanning from prototype to deployment, applying computer vision
    to real-world scenarios such as psychological assessment and industrial
    systems.
  </p>
  <p>
    If you are interested in my work, feel free to reach out via email!
  </p>

