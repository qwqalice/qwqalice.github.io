  summary: >-
    Contributed to football AI viewing features for China Mobile Migu's World
    Cup AI Zone, focusing on video understanding, player-aware visual signals,
    and evidence-grounded match commentary pipelines.
  details:
  - >-
    Supported AI Zone-oriented football video understanding by mapping raw match
    streams into structured event records for tactical visualization,
    intelligent commentary, highlight review, and viewer-facing Q&A scenarios.
  - >-
    Designed a streaming soccer understanding prototype covering semantic event
    boundaries, short-term event memory, memory-to-factual-caption conversion,
    and evidence-grounded live commentary data construction.
  - >-
    Built football player tracking and ReID data workflows that convert match
    videos into tracklets, player crops, team labels, OCR-assisted jersey-number
    cues, weak pair labels, and global identity annotations.
  - >-
    Organized player and match-preview assets, including roster normalization,
    face/body/jersey image screening, source-backed static metadata, and data
    quality rules for player-aware viewing features.

