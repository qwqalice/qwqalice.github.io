experience:
- name: MIGU Video Co., Ltd.
  dept: China Mobile Migu / Migu Video
  position: AI Algorithm Engineer Intern
  date: Apr. 2026 - Jul. 2026
  summary: >-
    Developed AI capabilities for football live streams, spanning video
    captioning, streaming commentary, player tracking, and close-up identity
    recognition.
  details:
  - title: Live Football Video Captioning for AI Zone
    description: >-
      Built a video captioning system for football live streams that converts
      continuous match footage into timestamped, structured event records with
      event types, actions, and factual descriptions. As a core capability of
      the World Cup AI Zone, it provides real-time, retrievable semantic
      evidence for downstream intelligent commentary and viewer-facing Q&A.
  - title: StreamSoccer Streaming Football Commentary
    description: >-
      Developed StreamSoccer, an end-to-end streaming football commentary
      system. It continuously integrates live video clips through event memory,
      generates factual event descriptions when an event closes, and writes
      retrievable historical records. The system supports event-level,
      recent-window, and long-term-memory commentary under strict causal
      constraints, with an online scheduler deciding when to comment or remain
      silent.
  - title: Player Tracking and Re-Identification System
    description: >-
      Developed a player tracking and re-identification system for football
      broadcasts. To handle camera cuts, occlusion, long absences, and local
      track-ID resets, it combines multi-object tracking, ReID representations,
      jersey-number OCR, team information, and temporal mutual-exclusion
      constraints to associate short tracklets into more stable match-level
      player identities. The system also supports global identity association,
      result export, and visualization.
  - title: Close-Up Player Identification and Personalized Commentary
    description: >-
      Built an end-to-end close-up player identification and personalized
      commentary system. A later iteration used ArcFace to encode facial
      features and built a player face database for identity matching. Public
      football information from sources such as Dongqiudi, commentary-style
      distillation from leading football content creators, and a large
      commentary corpus were used to fine-tune Qwen 3.5 4B, enabling the full
      pipeline from close-up identity recognition to player-information
      retrieval and personalized commentary generation.

projects:
- title: MentorForge — Research Mentor Distillation for AI Agents
  role: Open-source Project (13 ★)
  date: Jul. 2026
  description: >-
    An open-source Codex Skill that distills a scholar's publications, homepage,
    and academic trajectory into a runnable research operating system for AI
    agents. Rather than mimicking how a mentor talks, it captures how a mentor
    makes research judgments — what problems are worth doing, what experiments
    are convincing, and the methodology across research directions.
    Multi-source publication collection, full-text extraction, cross-paper
    synthesis, with evidence-grounded verification.
