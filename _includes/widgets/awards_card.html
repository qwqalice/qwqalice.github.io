<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <h6>Honors & Awards</h6>
                <div class="awards-list small">
                    {% for item in site.data.profile.awards %}
                    <div class="award-row d-flex py-2">
                        <div class="award-main pr-3">
                            <span>{{ item.name }}</span>
                            {% if item.award %}
                            <span class="text-muted ml-1">{{ item.award }}</span>
                            {% endif %}
                        </div>
                        <div class="award-date ml-auto no-break text-muted"><em>{{ item.date }}</em></div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
