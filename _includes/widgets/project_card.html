{% assign projects = site.data.profile.projects %}
{% if projects %}
<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <h6 class="mb-3"><i class="fas fa-diagram-project"></i> Selected Projects</h6>
                <div class="list-group list-group-flush">
                    {% for item in projects %}
                    <div class="list-group-item px-0 {% if forloop.first %}pt-0{% endif %}">
                        <div class="d-flex flex-column flex-md-row">
                            <h6 class="mb-1 font-weight-bold">{{ item.title }}</h6>
                            <div class="ml-md-auto text-muted small no-break"><em>{{ item.date }}</em></div>
                        </div>
                        <div class="small text-muted mb-1">{{ item.role }}</div>
                        <div class="small">{{ item.description }}</div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
